name: Build Windows launcher

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    # WPF (net8.0-windows) ne peut être compilé que sur un hôte Windows :
    # le SDK Microsoft.NET.Sdk.WindowsDesktop (compilateur XAML inclus) n'est distribué que là.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Publish (self-contained win-x64, exe unique, ~65 Mo)
        run: >
          dotnet publish src/MinecraftLauncherPerso/MinecraftLauncherPerso.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64-selfcontained

      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftLauncherPerso-win-x64-selfcontained
          path: publish/win-x64-selfcontained/**
          if-no-files-found: error

      # Build "framework-dependent" : quelques Mo au lieu de ~65 Mo, mais nécessite d'avoir
      # le .NET 8 Desktop Runtime installé sur la machine (téléchargeable depuis
      # https://dotnet.microsoft.com/download/dotnet/8.0 -> "Desktop Runtime" x64).
      - name: Publish (framework-dependent win-x64, léger)
        run: >
          dotnet publish src/MinecraftLauncherPerso/MinecraftLauncherPerso.csproj
          -c Release
          -r win-x64
          --self-contained false
          -o publish/win-x64-framework-dependent

      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftLauncherPerso-win-x64-framework-dependent
          path: publish/win-x64-framework-dependent/**
          if-no-files-found: error

  # Publie une GitHub Release (exe self-contained en pièce jointe) quand un tag v*.*.* est
  # poussé : c'est ce que GitHubUpdateService (Services/Update/) interroge pour l'auto-update du
  # launcher - il compare LauncherSettings.csproj <Version> au tag_name de la dernière release.
  # Pense à incrémenter <Version> dans MinecraftLauncherPerso.csproj avant de tagger.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MinecraftLauncherPerso-win-x64-selfcontained
          path: publish/win-x64-selfcontained

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "publish/win-x64-selfcontained/AL Launcher.exe"
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --generate-notes
