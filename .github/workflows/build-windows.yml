name: Build Windows launcher

on:
  push:
    branches:
      - main
      - dev
      - "claude/**"
    tags:
      - "v*"
  # PR vers main/dev (Dependabot notamment) : sans ce déclencheur, une PR dont la branche ne
  # correspond à aucun motif "push" ci-dessus (dependabot/**) n'était jamais compilée ni testée
  # avant d'être mergée. Le job "release" reste réservé aux tags (if plus bas).
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch: {}

# Moindre privilège : le job de build n'a besoin que de lire le dépôt. Seul le job "release"
# (plus bas) remonte à contents: write, pour créer/éditer la GitHub Release.
permissions:
  contents: read

jobs:
  build:
    # WPF (net10.0-windows) ne peut être compilé que sur un hôte Windows :
    # le SDK Microsoft.NET.Sdk.WindowsDesktop (compilateur XAML inclus) n'est distribué que là.
    runs-on: windows-latest
    outputs:
      # Tag vX.Y.Z à publier par le job "release", vide si ce run ne publie rien.
      release_tag: ${{ steps.release.outputs.tag }}

    steps:
      # fetch-depth 0 (historique + tags complets) : nécessaire à l'étape "Vérifie que
      # RELEASE_NOTES.md a été mis à jour" ci-dessous, qui compare son contenu au tag précédent.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Publication automatique (comme Fordix) : un push sur main dont <Version> n'a pas encore de
      # release publie vX.Y.Z tout seul, le job "release" créant le tag sur le commit poussé. Plus
      # besoin de poser le tag à la main, mais un tag vX.Y.Z poussé à la main marche toujours.
      # Un tag créé avec le jeton Actions ne redéclenche pas de workflow : tout se fait dans ce run.
      #
      # Sur un tag poussé, <Version> doit lui correspondre. Incident passé (v1.2.5) : <Version>
      # avait dérivé en avance sur les tags réellement publiés, cassant silencieusement
      # l'auto-update pendant un moment (voir README).
      #
      # Build de test (tout ce qui ne publie pas) : numéro du run, pour que l'exe affiche
      # "1.12.0-dev.<run>" au lieu de se faire passer pour la release (voir DevBuildNumber dans le
      # csproj et AppVersion.cs). Vide quand ce run publie.
      - name: Détermine la release à publier
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $csprojContent = Get-Content 'src/MinecraftLauncherPerso/MinecraftLauncherPerso.csproj' -Raw
          $match = [regex]::Match($csprojContent, '<Version>(.*?)</Version>')
          if (-not $match.Success) {
            Write-Error "Impossible de trouver <Version> dans MinecraftLauncherPerso.csproj."
            exit 1
          }
          $csprojVersion = $match.Groups[1].Value
          $tag = ""

          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
            if ($tagVersion -ne $csprojVersion) {
              Write-Error "Le tag '${{ github.ref_name }}' ne correspond pas à <Version>$csprojVersion</Version> dans le csproj. Corrige l'un des deux avant de retagger (voir README, section versionnage)."
              exit 1
            }
            $tag = "${{ github.ref_name }}"
            Write-Host "OK : tag $tag == <Version>$csprojVersion</Version>"
          } elseif ("${{ github.ref }}" -eq "refs/heads/main" -and "${{ github.event_name }}" -ne "pull_request") {
            $candidate = "v$csprojVersion"
            # Une version déjà publiée (release avec ses fichiers) n'est pas refaite : un merge
            # sur main sans changement de <Version> reste un simple build.
            $assets = gh release view $candidate --repo "${{ github.repository }}" --json assets --jq '.assets | length' 2>$null
            if ($LASTEXITCODE -eq 0 -and [int]$assets -gt 0) {
              Write-Host "La release $candidate existe déjà : rien à publier."
            } else {
              $tag = $candidate
              Write-Host "<Version>$csprojVersion</Version> n'a pas de release : ce run publie $tag."
            }
          }
          $global:LASTEXITCODE = 0

          $devBuildNumber = if ($tag) { "" } else { "${{ github.run_number }}" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "dev_build_number=$devBuildNumber" >> $env:GITHUB_OUTPUT

      # Les notes générées automatiquement par GitHub à partir des titres de PR/commits sont
      # illisibles pour un joueur ("Merge dev dans main : correctif urgent..."). RELEASE_NOTES.md
      # (à la racine du dépôt) contient à la place un texte rédigé à la main, en langage clair,
      # utilisé tel quel comme corps de la release (voir job "release" plus bas, --notes-file).
      # Ce check échoue le build si ce fichier n'a pas changé depuis le tag précédent : sans lui,
      # rien n'empêcherait de tagger une version avec des notes qui décrivent encore la précédente.
      - name: Vérifie que RELEASE_NOTES.md a été mis à jour
        if: steps.release.outputs.tag != ''
        shell: pwsh
        run: |
          $currentTag = "${{ steps.release.outputs.tag }}"
          $previousTag = git tag --sort=-v:refname --merged HEAD | Where-Object { $_ -ne $currentTag } | Select-Object -First 1
          if (-not $previousTag) {
            Write-Host "Pas de tag précédent trouvé, rien à comparer (probablement la toute première release)."
            exit 0
          }
          $diff = git diff --name-only "$previousTag" HEAD -- RELEASE_NOTES.md
          if (-not $diff) {
            Write-Error "RELEASE_NOTES.md n'a pas changé depuis $previousTag : décris cette version en langage clair pour les joueurs (une ligne '- ...' par changement visible) avant de poser le tag $currentTag."
            exit 1
          }

          # "A changé" ne suffit pas : il faut au moins une vraie ligne "- ..." hors du commentaire
          # d'en-tête, sinon la carte CHANGELOG du launcher et de la landing page (qui ne gardent
          # que ces lignes) n'afficheraient rien d'utile pour cette version.
          $body = [regex]::Replace((Get-Content RELEASE_NOTES.md -Raw), '(?s)<!--.*?-->', '')
          if (-not [regex]::IsMatch($body, '(?m)^\s*[-*] \S')) {
            Write-Error "RELEASE_NOTES.md ne contient aucune ligne '- ...' (hors commentaire) : rien à afficher dans le changelog pour $currentTag."
            exit 1
          }
          Write-Host "OK : RELEASE_NOTES.md a été mis à jour depuis $previousTag."

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      # Avertissements bloquants (v1.12.0) : analyseurs .NET (AnalysisLevel latest) et
      # nullabilité. Uniquement en CI, pour ne pas bloquer un essai en local.
      - name: Build (Release)
        run: dotnet build -c Release --no-restore -p:DevBuildNumber=${{ steps.release.outputs.dev_build_number }} -p:TreatWarningsAsErrors=true

      # Mise en forme (espaces, indentation) conforme aux conventions .NET : une différence fait
      # échouer la CI. Corriger en local avec "dotnet format whitespace".
      - name: Format (vérification)
        run: dotnet format whitespace --verify-no-changes --verbosity diagnostic

      # Le projet de tests fait partie du .sln (compilé par le Build ci-dessus, et "dotnet test" à la
      # racine fonctionne en local) ; ciblé explicitement ici pour ne lancer que lui. "dotnet test"
      # fait son propre restore/build, pas besoin de --no-restore.
      - name: Test
        run: dotnet test tests/MinecraftLauncherPerso.Tests/MinecraftLauncherPerso.Tests.csproj -c Release

      - name: Publish (self-contained win-x64, exe unique compressé)
        run: >
          dotnet publish src/MinecraftLauncherPerso/MinecraftLauncherPerso.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DevBuildNumber=${{ steps.release.outputs.dev_build_number }}
          -o publish/win-x64-selfcontained

      - uses: actions/upload-artifact@v7
        with:
          name: MinecraftLauncherPerso-win-x64-selfcontained
          path: publish/win-x64-selfcontained/**
          if-no-files-found: error

      # Build "framework-dependent" : quelques Mo au lieu des ~100+ Mo du self-contained (runtime
      # .NET 10 + WPF/WinForms non embarqué), mais nécessite d'avoir le .NET 10 Desktop Runtime
      # installé sur la machine (téléchargeable depuis
      # https://dotnet.microsoft.com/download/dotnet/10.0 -> "Desktop Runtime" x64).
      - name: Publish (framework-dependent win-x64, léger)
        run: >
          dotnet publish src/MinecraftLauncherPerso/MinecraftLauncherPerso.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:DevBuildNumber=${{ steps.release.outputs.dev_build_number }}
          -o publish/win-x64-framework-dependent

      - uses: actions/upload-artifact@v7
        with:
          name: MinecraftLauncherPerso-win-x64-framework-dependent
          path: publish/win-x64-framework-dependent/**
          if-no-files-found: error

  # Publie une GitHub Release (exe self-contained en pièce jointe) quand le job "build" a trouvé
  # une version à publier (tag v*.*.* poussé, ou <Version> sans release poussée sur main) : c'est ce que GitHubUpdateService (Services/Update/) interroge pour l'auto-update du
  # launcher - il compare LauncherSettings.csproj <Version> au tag_name de la dernière release.
  # Pense à incrémenter <Version> ET à mettre à jour RELEASE_NOTES.md (à la racine du dépôt, notes
  # en langage clair pour les joueurs) dans le même commit.
  release:
    needs: build
    if: needs.build.outputs.release_tag != ''
    runs-on: windows-latest
    # Un tag poussé à la main et le push sur main du même commit peuvent publier la même version :
    # l'un après l'autre, le second ne fait que remettre l'exe et les notes (voir plus bas).
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      # Nécessaire pour RELEASE_NOTES.md (--notes-file ci-dessous) : ce job ne fait sinon que
      # télécharger l'exe déjà construit, sans checkout du dépôt.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: MinecraftLauncherPerso-win-x64-selfcontained
          path: publish/win-x64-selfcontained

      # Si le tag a été créé via "Draft a new release" sur github.com, la release existe déjà
      # (créée en même temps que le tag, sans l'exe) : on y ajoute juste l'exe (--clobber écrase
      # un éventuel exe déjà attaché) au lieu d'essayer d'en créer une deuxième (qui échouerait).
      #
      # Bug corrigé (v1.10.0) : la branche "release déjà existante" ne touchait qu'à l'exe, jamais
      # aux notes — une release créée avant que RELEASE_NOTES.md soit rempli (draft créé tôt sur
      # github.com, ou tag repoussé après un premier essai) gardait pour toujours un corps vide
      # ("Full Changelog" seul), même après ce job. `gh release edit --notes-file` est donc appelé
      # dans les DEUX branches, pour que RELEASE_NOTES.md soit systématiquement la source de vérité
      # du corps de la release, peu importe comment elle a été créée.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $exe = "publish/win-x64-selfcontained/Omneria Games.exe"
          $tag = "${{ needs.build.outputs.release_tag }}"
          $repo = "${{ github.repository }}"

          # Empreinte SHA-256 publiée en pièce jointe séparée à côté de l'exe : vérifiée par
          # GitHubUpdateService (Services/Update/) avant d'exécuter une mise à jour téléchargée,
          # pour détecter un contenu altéré en transit plutôt que de l'exécuter aveuglément.
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLower()
          $hashFile = "$exe.sha256"
          Set-Content -Path $hashFile -Value $hash -NoNewline

          # Le commentaire HTML d'en-tête de RELEASE_NOTES.md (consignes pour le mainteneur) est
          # retiré avant publication : GitHub ne l'affiche pas, mais il partait tel quel dans le
          # corps brut de la release (API), donc dans tout ce qui le relit sans le rendre.
          $notes = [regex]::Replace((Get-Content RELEASE_NOTES.md -Raw), '(?s)<!--.*?-->', '').Trim()
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesFile -Value $notes -Encoding utf8

          gh release view $tag --repo $repo 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $hashFile --repo $repo --clobber
          } else {
            # RELEASE_NOTES.md (rédigé à la main, langage clair pour un joueur) plutôt que
            # --generate-notes (titres de PR/commits, illisibles pour un joueur) — voir le check
            # "Vérifie que RELEASE_NOTES.md a été mis à jour" dans le job "build" ci-dessus.
            # --target : commit sur lequel créer le tag quand il n'existe pas encore (publication
            # depuis main) ; sans effet sur un tag déjà poussé.
            gh release create $tag $exe $hashFile --repo $repo --title $tag --notes-file $notesFile --target ${{ github.sha }}
          }

          gh release edit $tag --repo $repo --notes-file $notesFile
